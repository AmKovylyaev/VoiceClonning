services:
  postgres_db:
    image: postgres:16-alpine
    container_name: postgres_media_dub_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${IP}:${DB_PORT}:5432"
    volumes:
      - pg_local_data:/var/lib/postgresql/data

volumes:
  pg_local_data:
