services:
  rabbitmq_server:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq_media_dub
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${IP}:${RABBITMQ_PORT}:5672"
      - "${IP}:${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_local_data:/var/lib/rabbitmq

volumes:
  rabbitmq_local_data:
