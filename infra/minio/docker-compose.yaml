services:
  minio_server:
    image: cr.yandex/mirror/minio/minio:latest
    container_name: minio_media_dub
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${IP}:${MINIO_PORT}:9000"
      - "${IP}:${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_local_data:/data
    command: server /data --console-address ":9001"

volumes:
  minio_local_data: